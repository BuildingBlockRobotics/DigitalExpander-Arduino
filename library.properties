sentence=Read encoders, colour and distance sensors, an IMU and a pose estimate from a BBR Digital Expander over I2C.
paragraph=The BBR Digital Expander adds four quadrature or pulse-width encoder inputs, four colour/distance sensor ports, four digital outputs and an optional IMU and odometry localizer to any Arduino-compatible board, over a single I2C connection. It can also watch a taught colour, a distance, an encoder threshold or a heading on its own and drive a digital output when the condition is met, with no bus traffic and no code in your loop.
